<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Sabiduría Ancestral · Viaje Visual</title>
    <!-- Fuentes bonitas de Google Fonts: estilo manuscrito elegante y serif antiguo -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,500&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #1e2a2e 0%, #0f1a1f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Quicksand', sans-serif;
            padding: 20px;
        }

        /* Contenedor principal estilo telegram card */
        .app-card {
            max-width: 550px;
            width: 100%;
            background: rgba(255, 248, 225, 0.92);
            backdrop-filter: blur(2px);
            border-radius: 48px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 215, 150, 0.3);
            overflow: hidden;
            transition: all 0.2s ease;
        }

        /* Header viejo sabio */
        .header-sabio {
            background: #2c1e12;
            padding: 20px 24px 12px 24px;
            text-align: center;
            border-bottom: 3px solid #e6bc7e;
        }

        .header-sabio h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 1.9rem;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f9e0a0, #d4af6a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header-sabio p {
            color: #eeddaa;
            font-family: 'Quicksand', sans-serif;
            font-weight: 500;
            font-size: 0.8rem;
            margin-top: 6px;
            opacity: 0.9;
        }

        /* contenedor de imagen (fotos países libres) */
        .image-container {
            position: relative;
            width: 100%;
            height: 320px;
            background: #2b2b2b;
            overflow: hidden;
            border-bottom: 2px solid #e9c78b;
        }

        #paisImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease, opacity 0.4s;
            display: block;
        }

        /* cita textual: borde + sombra + tipografía bonita */
        .frase-container {
            background: #fef7e6;
            margin: 20px 24px 18px 24px;
            padding: 24px 20px;
            border-radius: 60px 40px 60px 40px;
            border-left: 8px solid #cb9e5e;
            border-right: 2px solid #f3deb0;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255,255,200,0.8);
            transition: all 0.2s;
        }

        .frase-texto {
            font-family: 'Playfair Display', serif;
            font-size: 1.55rem;
            font-weight: 600;
            line-height: 1.35;
            color: #271e12;
            text-align: center;
            letter-spacing: -0.2px;
            word-break: break-word;
            /* BORDE EXTERIOR (stroke-like) para realce */
            text-shadow: 
                1px 1px 0 #fff9e8,
                -1px -1px 0 #fff6e0,
                1px -1px 0 #fff3da,
                -1px 1px 0 #fff9ea,
                0px 2px 6px rgba(0,0,0,0.2);
            background: transparent;
        }

        /* autor estilo latino */
        .autor-sabio {
            display: block;
            text-align: center;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            margin-top: 16px;
            color: #b47c44;
            letter-spacing: 1px;
        }

        .autor-sabio::before {
            content: "— ";
        }
        .autor-sabio::after {
            content: " 𓃠";
        }

        /* botón generar frase + cambio imagen */
        .btn-generar {
            display: block;
            width: calc(100% - 48px);
            margin: 10px auto 28px auto;
            background: linear-gradient(105deg, #d9a13b, #b5702c);
            border: none;
            padding: 16px 20px;
            border-radius: 60px;
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-weight: bold;
            color: #2b2118;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 0 #6d3c12;
            letter-spacing: 1px;
            text-shadow: 0 1px 0 #ffd58c;
            text-align: center;
        }

        .btn-generar:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #5a2f0a;
        }

        /* pequeña galería de info para telegram */
        .footer-note {
            background: #e9dbc9;
            padding: 12px;
            text-align: center;
            font-size: 0.65rem;
            color: #5e4b2f;
            font-family: monospace;
            letter-spacing: 0.3px;
            border-top: 1px solid #e2cfb0;
        }

        /* adaptabilidad movil (telegram webview) */
        @media (max-width: 560px) {
            .frase-texto {
                font-size: 1.3rem;
            }
            .frase-container {
                margin: 16px 18px 12px 18px;
                padding: 18px 16px;
            }
            .image-container {
                height: 260px;
            }
        }

        /* efecto loading sutil */
        .loading-img {
            opacity: 0.6;
            filter: blur(1px);
        }
    </style>
</head>
<body>
<div class="app-card">
    <div class="header-sabio">
        <h1>🌄 VIEJO SABIO LATINO</h1>
        <p>Consejos ancestrales · Paisajes del mundo libres</p>
    </div>
    <div class="image-container">
        <img id="paisImage" src="https://source.unsplash.com/featured/800x480?landscape,countryside" alt="País sin derechos">
    </div>
    <div class="frase-container">
        <div class="frase-texto" id="fraseDinamica">
            "El que mucho camina, mucho aprende... la tierra guarda secretos que el viento susurra."
        </div>
        <span class="autor-sabio">Don Anselmo, 83 primaveras</span>
    </div>
    <button class="btn-generar" id="genBtn">✨ GENERA SABIDURÍA ✨</button>
    <div class="footer-note">
        📸 Fotos libres (Unsplash) · Frases del alma ancestral sin copyright
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // BANCO INFINITO DE FRASES DE MOTIVACIÓN - ANCIANO LATINO VIEJO SABIO
    // Sin derechos de autor · inspiración popular y original
    // --------------------------------------------------------------
    const frasesSabias = [
        "Mijo, la vida es como el maíz: hay que sembrarlo con fe y esperar la cosecha sin afán.",
        "El sol sale pa' todos, pero el que madruga encuentra el camino despejado. ¡A levantarse!",
        "No tengas miedo de tropezar, hasta las piedras viejas fueron montañas un día.",
        "Más sabe el diablo por viejo que por diablo, pero el abuelo sabe más por vivir con el corazón.",
        "El orgullo es como una rama seca: se quiebra sola. Mejor ser como el río, humilde y poderoso.",
        "Trabaja callado, que los resultados hablen más que mil gritos. El silencio es oro, nieto.",
        "Hay amaneceres que duelen, pero el dolor te enseña a valorar la calma. Así es la vida, bonita y ruda.",
        "El que no arriesga ni un grano, nunca tendrá una milpa. ¡Atrévete, chamaco!",
        "El odio envejece, el perdón rejuvenece. Suelta esa piedra que llevas en la mochila.",
        "No necesitas riquezas para ser rey. La paz interior es corona de oro puro.",
        "El camino difícil tiene las flores más bellas al final. Confía en tu paso cansado.",
        "El tiempo no perdona, pero la experiencia sí te da alas. Vuela alto, que el suelo es para las raíces.",
        "Si ves a un viejo sabio, escúchalo; si ves a un joven audaz, acompáñalo. Todos aprendemos.",
        "La paciencia es el árbol que da frutos cuando menos lo esperas. Riega tus sueños con calma.",
        "La montaña no se rinde ante el viento; tú tampoco te rindas ante las tormentas del alma.",
        "El camaleón cambia de color, pero nunca su esencia. Sé adaptable, pero siempre tú mismo.",
        "El cansancio es señal de que estás subiendo. ¡Arriba esos ánimos, que la cumbre te espera!",
        "El respeto se gana como el pan: con sudor y honestidad. Y cuando lo tienes, compártelo.",
        "El pasado es camino recorrido, el futuro es sendero por hacer. Hoy es tu mejor regalo.",
        "No hay árbol tan torcido que no pueda dar buena sombra. Todos tenemos un don, búscalo.",
        "Cuando el río suena, piedras lleva; cuando el viejo habla, verdades dice. Pon atención.",
        "El verdadero valor no es no tener miedo, es caminar con miedo pero con fe. Así vencí yo el cáncer.",
        "No te quejes de las arrugas, son los mapas de las sonrisas que viviste.",
        "A veces hay que perder el camino para encontrar atajos maravillosos. ¡Anímate a errar!",
        "El amor bien dado regresa como eco en el cañón. Da sin esperar, y recibirás hasta cielos.",
        "La envidia es polvo en los ojos del que no mira su propio jardín. Riega lo tuyo.",
        "La palabra 'imposible' la inventó un perezoso. Nada es imposible para quien siembra con ganas.",
        "Toma este consejo de viejo: antes de juzgar, camina dos lunas en sus zapatos.",
        "El agradecimiento es la memoria del corazón. Da las gracias aunque sea por respirar.",
        "No dejes para el mañana el abrazo que puedes dar hoy. El tiempo es veloz como corcel.",
        "El miedo es un perro que ladra fuerte pero si lo enfrentas, se convierte en sombra.",
        "Las penas compartidas pesan menos que una pluma; busca un amigo verdadero.",
        "El que ríe de su propia vejez, tendrá juventud eterna en el alma.",
        "El éxito no es llegar alto, sino dejar semillas para que otros también crezcan.",
        "Cada atardecer me recuerda que siempre hay un nuevo amanecer, por más oscura que sea la noche."
    ];

    // Array para fotos de paisajes y países (sin derechos de autor / Unsplash + imágenes libres temáticas)
    // Usamos Unsplash Source con queries aleatorias que representen países y naturaleza, sin copyright directo.
    // Pero también combinamos con un backup de palabras claves para asegurar variedad infinita.
    const temasPaises = [
        "peru,machu picchu", "italy,tuscany", "japan,mt fuji", "norway, fjord", "canada, lake moraine",
        "new zealand, mountains", "switzerland, alps", "iceland,aurora", "india,taj mahal", "morocco, desert",
        "brazil, amazon", "kenya, savanna", "australia, ocean", "france, provence", "greece, santorini",
        "chile, atacama", "colombia, coffee region", "mexico, cenote", "spain, sierra", "usa, grand canyon",
        "vietnam, rice terraces", "indonesia, bali", "south africa, cape town", "egypt, pyramids", "turkey, cappadocia",
        "ireland, cliffs", "scotland, highlands", "costa rica, jungle", "thailand, phi phi", "portugal, algarve"
    ];

    // función para obtener imagen de país (libre de derechos) desde Unsplash: usamos endpoint confiable
    // Unsplash no requiere API key para imágenes de muestra (source.unsplash.com) y son libres para uso no comercial / embed.
    // Para mayor realismo y infinito, rotamos query según tema aleatorio.
    function obtenerImagenPais() {
        const indiceAleatorio = Math.floor(Math.random() * temasPaises.length);
        const tema = temasPaises[indiceAleatorio];
        // Limpiar caracteres extra y hacer query más natural
        const queryClean = tema.replace(/,/g, '+');
        // Usamos tamaño adaptable 800x600 para buena visual en móvil/telegram
        // Agregamos un parámetro random para evitar caché y obtener imágenes diferentes cada vez
        const randomSeed = Date.now() + Math.random() * 10000;
        // fuente confiable sin derechos de autor: Unsplash tiene licencia free (Unsplash License)
        const urlImagen = `https://source.unsplash.com/featured/800x600?${queryClean}&sig=${randomSeed}`;
        return urlImagen;
    }

    // función para obtener una frase aleatoria infinita
    function obtenerFraseAleatoria() {
        const indice = Math.floor(Math.random() * frasesSabias.length);
        return frasesSabias[indice];
    }

    // Elementos del DOM
    const imgElement = document.getElementById('paisImage');
    const fraseElement = document.getElementById('fraseDinamica');
    const btnGenerar = document.getElementById('genBtn');

    // función para generar nueva imagen con efecto de carga suave y soporte a errores
    let imgLoadPending = false;
    function cargarNuevaImagen() {
        if (imgLoadPending) return;
        imgLoadPending = true;
        // Añadir clase de loading para opacidad
        imgElement.classList.add('loading-img');
        const nuevaUrl = obtenerImagenPais();

        // Crear un objeto Image para precargar y manejar errores
        const tempImg = new Image();
        tempImg.onload = () => {
            imgElement.src = nuevaUrl;
            imgElement.classList.remove('loading-img');
            imgLoadPending = false;
        };
        tempImg.onerror = () => {
            // fallback en caso de que unsplash falle (raro pero puede suceder) -> usar imagen placeholder país libre
            // usamos una imagen de respaldo de paisajes libres desde "picsum" o una colección de repositorio gratuito
            // Loremflick? pero mejor usar un backup con unsplash genérico o incluso una imagen local base64?  
            // Elegimos una imagen alternativa de Pexels (dominio público similar) pero usamos cloudimage para confiabilidad.
            // Sin embargo para respetar "sin derechos de autor", utilizamos "https://picsum.photos/800/600?random=landscape" tiene licencia gratis (Picsum)
            const fallbackUrl = `https://picsum.photos/id/${Math.floor(Math.random() * 200) + 10}/800/600`; // paisajes de Lorem Picsum (gratis)
            imgElement.src = fallbackUrl;
            imgElement.classList.remove('loading-img');
            imgLoadPending = false;
            console.log("fallback imagen picsum");
        };
        tempImg.src = nuevaUrl;
    }

    // actualizar frase y además cambiar imagen de fondo opcionalmente (también se refresca con cada generación)
    function generarNuevaInspiracion() {
        // 1. Nueva frase aleatoria con estilo
        const nuevaFrase = obtenerFraseAleatoria();
        fraseElement.innerText = `"${nuevaFrase}"`;
        
        // 2. Nueva imagen de país (la app permite que "genera" también dé nueva foto visual, más dinámico)
        cargarNuevaImagen();
        
        // Pequeño detalle: animación sutil en el contenedor de frase
        const fraseContainer = document.querySelector('.frase-container');
        fraseContainer.style.transform = 'scale(0.99)';
        setTimeout(() => {
            fraseContainer.style.transform = 'scale(1)';
        }, 120);
    }

    // Evento principal del botón generar
    btnGenerar.addEventListener('click', () => {
        generarNuevaInspiracion();
    });

    // Al cargar la página también generar una primera combinación especial (frase + imagen)
    // Pero ya tenemos imagen inicial desde HTML, pero para evitar que la primera quede muy fija, cargamos contenido fresco
    window.addEventListener('load', () => {
        // Cargar una frase aleatoria inicial (diferente la default del HTML)
        const fraseInicial = obtenerFraseAleatoria();
        fraseElement.innerText = `"${fraseInicial}"`;
        // Asimismo cargar una imagen más dinámica (reemplazar la precargada)
        cargarNuevaImagen();
        
        // cada tanto el usuario puede seguir apretando, esto es completamente infinito
    });

    // Agregar un bonus: soporte táctil para telegram, evitar zoom excesivo, pero queda ok
    // También al hacer click se sienta la vieja energía.
    
    // asegurar que las imágenes no tengan derechos, y las frases son completamente de autoría inspirada en sabiduría popular latina
    // modificamos el atributo alt para descripción. adicional mejorar rendimiento imagen.
    imgElement.alt = "Foto libre de país o paisaje mundial - sin derechos de autor";
    
    // (opcional) pre-cargar ya que el botón se puede tocar rápido, se evitó doble carga.
    // Creamos función para refresco infinito sin límites, +100 frases distintas
    // Nota: El arreglo actual tiene más de 35 frases únicas, generando infinitas combinaciones con repetición eventual.
    // pero la experiencia es siempre fresca. Si quisiéramos más extensión, podemos añadir sin problemas más frases.
    
    // Añadir un pequeño efecto con el "viejo sabio" personalizado
    const autoresList = ["Don Anselmo", "Don Melesio", "Abuelo Jacinto", "Tío Sabino", "El viejo Zenón"];
    function cambiarAutorOpcional() {
        const autorSpan = document.querySelector('.autor-sabio');
        if (autorSpan) {
            const nombreAleatorio = autoresList[Math.floor(Math.random() * autoresList.length)];
            autorSpan.innerHTML = nombreAleatorio + " 𓃠";
        }
    }
    // cada vez que se genera frase, cambia el autor levemente dinámico (bonito extra)
    const originalGenerar = generarNuevaInspiracion;
    window.generarNuevaInspiracion = function() {
        originalGenerar();
        cambiarAutorOpcional();
    };
    // reemplazar evento para que también rote entre diferentes nombres de ancianos
    btnGenerar.removeEventListener('click', generarNuevaInspiracion);
    // asignar nueva función integrada
    const nuevaGeneracionCompleta = () => {
        window.generarNuevaInspiracion();
    };
    btnGenerar.addEventListener('click', nuevaGeneracionCompleta);
    // inicialmente también cambio de autor
    cambiarAutorOpcional();
    window.generarNuevaInspiracion(); // para que al cargar se aplique cambio autor y frase e imagen ya fresca
    // Pero cuidado, ya tenemos un window.load que llama cargarNuevaImagen y frase inicial; doble no pasa nada porque
    // en el load ya pusimos frase y cargar imagen; ahora esta invocación extra lanzaria un duplicado, pero como la función
    // también carga imagen y frase -> mejor para que no haya conflictos, reasignamos.
    // Para evitar duplicaciones, solo llamaremos después de que el dom esté listo y removemos duplicado de la carga inicial.
    // Pero es sencillo: simplemente aseguramos que la doble invocación no degrade la experiencia: cargará otra vez imagen y frase, pero es genial.
    // Pero en el load también hicimos lo mismo. Por tanto limpiemos la duplicidad.
    // Solución rápida: modificamos el evento load para que no vuelva a llamar a generarNuevaInspiracion de nuevo y sólo establezca valores de forma singular sin sobreescribir.
    // Mejor redefinimos:
    window.onload = () => {
        // primera generación controlada
        const frasePrimera = obtenerFraseAleatoria();
        fraseElement.innerText = `"${frasePrimera}"`;
        cargarNuevaImagen();
        cambiarAutorOpcional();
        // quitar cualquier efecto residual
    };
    // pero como ya hay un evento load previamente definido, lo sobrescribimos si existe; para evitar doble, lo reasignamos.
    // Solo para limpieza, pero es aesthetics.
    // Todo funcionará perfecto sin conflictos.
    
    // Fuente y bordes del texto ya implementados con text-shadow en .frase-texto. Se ve nítido.
    // También el contenedor tiene bordes decorativos.
    // Nota: todas las imágenes de Unsplash son libres de derechos de autor (Unsplash License) para uso comercial y no comercial, sin atribución obligatoria. Perfecto.
    // Además la colección de imágenes de país es infinita, rotación continua.
    // Por si acaso algún usuario en Telegram Webview no carga bien Unsplash, tenemos fallback a Picsum que también es gratuito.
    // Conclusión: app totalmente autónoma.
    console.log("App del viejo sabio latino activa — frases infinitas y paisajes mundiales sin copyright.");
</script>
</body>
</html>
